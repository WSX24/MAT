# 为什么仓库根要有一份 pytest.ini：不加的话，从根目录跑 pytest 会一路收集进
# ppt-master/（第三方 skill，自带一份演示用的 pdf_to_md.py），报 3 个 collection error，
# 那几条与课堂无关的东西混进统计里，基线数字就看不懂了。
#
# 只做两件事：把收集范围钉在课堂测试上、asyncio_mode 与 classroom/pytest.ini 对齐
# （异步用例不必逐个标 @pytest.mark.asyncio）。
#
# 在 classroom 目录里跑 pytest 不受影响：pytest 取**最近**的那份 ini 当 rootdir，
# 那里的 testpaths = tests 依旧生效。
[pytest]
testpaths = TeachingFlow/classroom/tests
asyncio_mode = auto
