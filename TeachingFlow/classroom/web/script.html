<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课堂脚本分支树 · 双脑三体</title>
<link rel="stylesheet" href="/static/classroom.css">
<link rel="stylesheet" href="/static/script.css">
</head>
<body>
<div class="script">
  <div class="titlebar">
    <h1>课堂脚本分支树</h1>
    <span class="hint" id="meta">加载中…</span>
    <span class="grow"></span>
    <span class="hint"><a href="/">上课页</a> · <a href="/hub">启动台</a> · <a href="/graph">课堂走向图</a> · <a href="/review">脚本审核</a></span>
  </div>

  <div class="toolbar" id="toolbar">
    <button id="expandAll">全展开</button>
    <button id="collapseAll">全折叠</button>
    <label class="chk"><input type="checkbox" id="onlyBranch"> 只看含分支的页</label>
    <label class="chk"><input type="checkbox" id="follow" checked> 跟随当前</label>
    <span class="grow"></span>
    <span class="hint" id="pollinfo"></span>
  </div>

  <div class="legend">
    <span class="lg"><i class="ln"></i>预置变体（plan.json 的 v1/v2）</span>
    <span class="lg"><i class="ln dashed"></i>C 运行期造的候选</span>
    <span class="lg"><i class="dot st-alive"></i>alive 池内可用</span>
    <span class="lg"><i class="dot st-consumed"></i>consumed 已被选中</span>
    <span class="lg"><i class="dot st-expired"></i>expired 已作废</span>
  </div>

  <p class="notice" id="notice" hidden></p>
  <div class="livebar" id="livebar" hidden></div>

  <!-- 树容器：页节点（一级）→ 单元节点（二级）→ 分支节点 -->
  <div class="tree" id="tree"><p class="hint">加载中…</p></div>
  <div id="poolfree"></div>

  <p class="hint foot">这一页是<b>只读观测面</b>：不开课堂、不进状态机、不消费事件 ——
    可以和上课页同时开着，互不影响。课堂没在跑时它照常可浏览，只是没有高亮。</p>
</div>

<script>
(function () {
  'use strict';
  const $ = function (id) { return document.getElementById(id); };
  const qsa = function (sel) { return Array.from(document.querySelectorAll(sel)); };
  const POLL_MS = 1000;          // 只读轮询间隔（默认 1 秒）
  const SUMMARY_CHARS = 40;      // 单元文本摘要在树上的长度（再长一行就挤不下了）

  //: 轮询时的索引：只碰这几个 map，不去重扫 400 个节点。
  //: last* 记的是"上一次已经渲染过的位置"，没有变化就不动 DOM —— 每秒滚一次屏
  //: 或者每秒强制展开一次，都会让用户没法自己看别的页。
  const S = {
    unitEls: new Map(), pageEls: new Map(), presetEls: new Map(), candEls: new Map(),
    lastUnit: '', lastEl: null, lastPage: -1, staticHint: '', timer: null,
  };

  const STATE_TEXT = {
    alive: 'alive 池内可用', consumed: 'consumed 已被选中',
    expired: 'expired 已作废', none: '未入池',
  };

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .split('&').join('&amp;').split('<').join('&lt;')
      .split('>').join('&gt;').split('"').join('&quot;');
  }
  function clip(s, n) {
    const t = String(s || '').split(/[ \t\r\n]+/).join(' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }
  function fmtSec(v) {
    const n = Number(v);
    return isFinite(n) && n > 0 ? n.toFixed(1) + ' 秒' : '—';
  }
  function setNotice(text) {
    const n = $('notice');
    if (!text) { n.hidden = true; n.textContent = ''; return; }
    n.hidden = false; n.textContent = text;
  }

  // ---------------------------------------------------------------- 静态结构
  function unitNode(u) {
    const el = document.createElement('div');
    const hasBranch = (u.variants || []).length > 0;
    el.className = 'unit' + (u.is_page_end ? ' pageend' : '') + (hasBranch ? ' branching' : '');
    el.dataset.unit = u.unit_id;

    const badges = ['<span class="bd">#' + ((u.index_in_slide | 0) + 1) + '</span>'];
    if (u.is_page_end) {
      // 页尾单元 = 翻页点 + 探针窗口的开口处，两个事实分开标：
      // 看到"页尾"知道要翻页，看到"探针"知道学生有 12 秒可以打断。
      badges.push('<span class="bd bd-pageend">页尾</span>');
      badges.push('<span class="bd bd-probe">探针</span>');
    }
    if (hasBranch) badges.push('<span class="bd bd-branch">含分支 ' + u.variants.length + '</span>');

    const head = document.createElement('div');
    head.className = 'uhead';
    head.innerHTML =
      '<span class="unitboundary">单元边界</span>' +
      '<span class="uid">' + esc(u.unit_id) + '</span>' +
      '<span class="usum">' + esc(clip(u.text, SUMMARY_CHARS)) + '</span>' +
      '<span class="ubadges">' + badges.join('') + '</span>';

    const info = document.createElement('div');
    info.className = 'uinfo';
    info.textContent = '约 ' + fmtSec(u.est_sec) + ' · kp ' + ((u.kp || []).join(',') || '—') +
      ' · 锚点 ' + (u.anchors_count | 0) + ' · 课件操作 ' + (u.ops_count | 0);

    const sw = document.createElement('div');
    sw.className = 'uSw';

    const branches = document.createElement('div');
    branches.className = 'branches';
    (u.variants || []).forEach(function (v) {
      const b = document.createElement('div');
      b.className = 'branch preset st-none';
      b.dataset.vid = v.variant_id;
      b.title = '预置变体（plan.json）· 点标题行展开/收起全文';
      b.innerHTML =
        '<div class="bhead"><span class="blabel">' + esc(v.label || v.variant_id) + '</span>' +
        '<span class="bvid">' + esc(v.variant_id) + '</span>' +
        '<span class="bstate">' + STATE_TEXT.none + '</span>' +
        '<span class="bmeta">约 ' + fmtSec(v.est_sec) + '</span></div>' +
        '<div class="btext">' + esc(v.text) + '</div>';
      b.querySelector('.bhead').addEventListener('click', function () {
        b.classList.toggle('expanded');
      });
      branches.appendChild(b);
      S.presetEls.set(u.unit_id + '|' + v.variant_id, b);
    });

    el.append(head, info, sw, branches);
    return el;
  }

  function pageNode(page, hasBranch) {
    const sec = document.createElement('section');
    // 首次加载**一律折叠**，与"这一页有没有分支"无关。
    // 为什么不用 hasBranch 决定初始展开：真实课件 177/177 个单元都有变体，于是
    // hasBranch 恒真、默认全展开 —— 打开页面就是 177 个单元摊开，而这页存在的意义
    // 恰恰是"先看清整门课的结构"。折叠态的页头已经写着"N 单元 · M 分支"，42 行就能
    // 扫完流程；要细节就点开，或者开「跟随当前」让它替你展开当前页。
    // 折叠态回答"课长什么样"、展开态回答"这一页有哪些分支" —— 两个不同的问题，
    // 不该共用一个默认值同时满足。
    sec.className = 'page collapsed';
    sec.dataset.page = page.index;
    sec.dataset.hasBranch = hasBranch ? '1' : '';

    const nBranch = page.units.reduce(function (a, u) { return a + (u.variants || []).length; }, 0);
    const head = document.createElement('div');
    head.className = 'phead';
    head.innerHTML =
      '<span class="caret">▸</span>' +
      '<span class="pageboundary">第 ' + ((page.index | 0) + 1) + ' 页</span>' +
      '<span class="ptitle">' + esc(page.title || '（无标题）') + '</span>' +
      '<span class="pmeta">' + page.units.length + ' 单元' +
      (hasBranch ? ' · ' + nBranch + ' 分支' : ' · 无分支') + '</span>';
    head.addEventListener('click', function () { sec.classList.toggle('collapsed'); });

    const body = document.createElement('div');
    body.className = 'pbody';
    page.units.forEach(function (u) {
      const el = unitNode(u);
      body.appendChild(el);
      S.unitEls.set(u.unit_id, el);
    });
    sec.append(head, body);
    S.pageEls.set(page.index, sec);
    return sec;
  }

  function renderTree(d) {
    const tree = $('tree');
    tree.textContent = '';
    S.unitEls.clear(); S.pageEls.clear(); S.presetEls.clear(); S.candEls.clear();
    $('poolfree').textContent = '';

    const m = d.meta || {};
    S.staticHint = d.ok ? '' : (d.hint || '这份课件没有可显示的分支结构。');
    $('meta').textContent = d.ok
      ? ((m.deck_title || '') + ' · ' + m.total_slides + ' 页 / ' + m.total_units +
         ' 单元 / ' + m.variants_total + ' 个预置变体 · 脚本来源 ' + (m.plan_source || '—'))
      : '这份课件没有分支结构';

    if (!d.ok) {
      setNotice(S.staticHint);
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = '没有可显示的页。' + (d.mode === 'simple' ? '当前用的是原型自带的手写演示课件。' : '');
      tree.appendChild(p);
      return;
    }
    const frag = document.createDocumentFragment();
    (d.pages || []).forEach(function (page) {
      const hasBranch = (page.units || []).some(function (u) { return (u.variants || []).length > 0; });
      frag.appendChild(pageNode(page, hasBranch));
    });
    tree.appendChild(frag);
    applyFilter();
    applyNotice(false);
  }

  // ---------------------------------------------------------------- 运行期叠加
  function setPoolState(el, status) {
    const st = ['alive', 'consumed', 'expired'].indexOf(status) >= 0 ? status : 'none';
    el.classList.remove('st-alive', 'st-consumed', 'st-expired', 'st-none');
    el.classList.add('st-' + st);
    const tag = el.querySelector('.bstate');
    if (tag) tag.textContent = STATE_TEXT[st];
  }

  function candNode(p) {
    const el = document.createElement('div');
    el.className = 'branch cand st-none';
    el.dataset.cand = p.candidate_id;
    el.title = 'C（后台 propose）造的候选 · ' + (p.candidate_id || '');
    el.innerHTML =
      '<div class="bhead"><span class="blabel">' + esc(p.label || p.variant_id || '候选') + '</span>' +
      '<span class="bvid">' + esc(p.candidate_id || '') + '</span>' +
      '<span class="bstate">' + STATE_TEXT.none + '</span>' +
      '<span class="bmeta">C 造的</span></div>';
    return el;
  }

  function applySwitched(switched) {
    qsa('.unit.switched').forEach(function (el) {
      el.classList.remove('switched');
      const s = el.querySelector('.uSw');
      if (s) s.textContent = '';
    });
    qsa('.branch.applied').forEach(function (el) { el.classList.remove('applied'); });
    Object.keys(switched || {}).forEach(function (unitId) {
      const rows = switched[unitId] || [];
      const el = S.unitEls.get(unitId);
      if (!el || !rows.length) return;
      const last = rows[rows.length - 1];
      el.classList.add('switched');
      const s = el.querySelector('.uSw');
      if (s) {
        s.textContent = '↻ 已换讲法：' + (last.label || last.variant_id) +
          '（' + last.variant_id + '）· 决策于 ' + (last.decided_at || '—') +
          ' · 切换前探针 ' + (last.probe_before || '—') +
          ' → 切换后 ' + (last.probe_after || '未收尾');
      }
      const b = S.presetEls.get(unitId + '|' + last.variant_id);
      if (b) b.classList.add('applied');
    });
  }

  function renderFree(rows) {
    const host = $('poolfree');
    host.textContent = '';
    if (!rows.length) return;
    const box = document.createElement('div');
    box.className = 'free';
    const h = document.createElement('h3');
    h.textContent = '未定向候选（target_unit 为空或单元不在这份脚本里）';
    box.appendChild(h);
    rows.forEach(function (p) {
      const el = candNode(p);
      setPoolState(el, p.status);
      box.appendChild(el);
    });
    host.appendChild(box);
  }

  function applyPool(poolRows) {
    const seen = new Set();
    const free = [];
    (poolRows || []).forEach(function (p) {
      // 预置货是 plan.json 里那两条变体在池中的运行期副本：它更新**实线**的状态，
      // 不再另画一根虚线 —— 否则同一支讲法会在树上出现两次，而"池里有几条"和
      // "这门课有几支讲法"本来是两个数。
      if (p.source === 'preset') {
        const el = S.presetEls.get((p.target_unit || '') + '|' + p.variant_id);
        if (el) setPoolState(el, p.status);
        return;
      }
      const unitEl = p.target_unit ? S.unitEls.get(p.target_unit) : null;
      if (!unitEl) { free.push(p); return; }
      seen.add(p.candidate_id);
      let node = S.candEls.get(p.candidate_id);
      if (!node) {
        node = candNode(p);
        S.candEls.set(p.candidate_id, node);
        const box = unitEl.querySelector('.branches');
        if (!box) return;
        box.appendChild(node);
      }
      setPoolState(node, p.status);
    });
    // 池里已经不再列出的候选：删掉。留着它等于在树上说"这条此刻还在池里"。
    S.candEls.forEach(function (node, id) {
      if (!seen.has(id)) { node.remove(); S.candEls.delete(id); }
    });
    renderFree(free);
  }

  function applyCurrent(cur) {
    const unitId = (cur && cur.unit_id) || '';
    if (unitId === S.lastUnit && S.lastEl) return;   // 没换格就不动（别每秒滚屏）
    if (S.lastEl) S.lastEl.classList.remove('current');
    S.lastEl = S.unitEls.get(unitId) || null;
    S.lastUnit = unitId;
    if (!S.lastEl) return;
    S.lastEl.classList.add('current');
    const sec = S.pageEls.get(cur.slide_index);
    // 展开当前页 / 滚到当前格**只在「跟随当前」勾选时**做。关掉跟随还自动展开，
    // 等于用户每折一次都被下一条轮询重新掀开 —— 手动操作立刻失效。
    // 展开也只在**换页**那一次做：同一页里换格不再动折叠状态，用户折起来的那一页
    // 才不会每秒被掀开一次。
    if ($('follow').checked) {
      if (sec && cur.slide_index !== S.lastPage) {
        sec.classList.remove('collapsed');
        S.lastPage = cur.slide_index;
      }
      if (S.lastEl.scrollIntoView) {
        S.lastEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }

  function renderLivebar(d) {
    const c = d.current || {};
    const up = c.unit_progress || {};
    const st = d.stats || {};
    const alive = (d.pool || []).filter(function (p) { return p.status === 'alive'; }).length;
    const switched = Object.keys(d.switched || {}).length;
    const bar = $('livebar');
    bar.hidden = false;
    bar.innerHTML =
      '<span class="pill">阶段 <b>' + esc(c.phase || '—') + '</b></span>' +
      '<span class="pill">第 ' + ((c.slide_index | 0) + 1) + ' 页 · 第 ' +
        ((c.seg_index | 0) + 1) + ' 段</span>' +
      '<span class="pill">当前单元 <b>' + esc(c.unit_id || '—') + '</b>（第 ' +
        (up.spoken | 0) + ' / ' + (up.total | 0) + ' 句）</span>' +
      '<span class="pill">J 预取 ' + (st.prefetched | 0) + ' · 应用 ' + (st.applied | 0) +
        ' · 无候选 ' + (st.none | 0) + ' · 超时 ' + (st.timeout | 0) +
        ' · 过期 ' + (st.stale | 0) + ' · 异常 ' + (st.error | 0) + '</span>' +
      '<span class="pill">池内 alive <b>' + alive + '</b> / 共 ' + (d.pool_total | 0) + ' 条</span>' +
      '<span class="pill">已换讲法 <b>' + switched + '</b> 格</span>';
  }

  function applyNotice(running) {
    if (S.staticHint) { setNotice(S.staticHint); return; }
    setNotice(running ? '' : '课堂当前没有在运行：这棵树照常可以浏览、展开、看变体；' +
      '等上课页开课后，当前单元高亮和被换过的讲法会自动出现（本页只读轮询，不会启动课堂）。');
  }

  function applyLive(d) {
    if (!d || !d.running) {
      if (S.lastEl) { S.lastEl.classList.remove('current'); S.lastEl = null; }
      S.lastUnit = ''; S.lastPage = -1;
      qsa('.branch.cand').forEach(function (el) { el.remove(); });
      S.candEls.clear();
      qsa('.unit.switched').forEach(function (el) {
        el.classList.remove('switched');
        const s = el.querySelector('.uSw');
        if (s) s.textContent = '';
      });
      qsa('.branch').forEach(function (el) { setPoolState(el, 'none'); });
      qsa('.branch.applied').forEach(function (el) { el.classList.remove('applied'); });
      $('poolfree').textContent = '';
      $('livebar').hidden = true;
      applyNotice(false);
      return;
    }
    applyNotice(true);
    renderLivebar(d);
    applySwitched(d.switched || {});
    applyPool(d.pool || []);
    applyCurrent(d.current || {});
  }

  // ---------------------------------------------------------------- 轮询
  // 页面不可见就停：一个后台标签页每秒请求一次，烧的是这台机器的 CPU 和后端的
  // 每个请求 —— 而这段时间里没有任何一双眼睛在看它。
  function stopPolling() {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
  }
  function startPolling() {
    stopPolling();
    S.timer = setInterval(pollLive, POLL_MS);
    pollLive();
  }
  async function pollLive() {
    if (document.hidden) return;          // 双保险：定时器已经停了，这里再挡一次
    try {
      const r = await fetch('/api/script/live', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      applyLive(await r.json());
      $('pollinfo').textContent = '每 ' + (POLL_MS / 1000) + ' 秒只读轮询 · 最近一次 ' +
        new Date().toLocaleTimeString();
    } catch (e) {
      $('pollinfo').textContent = '轮询失败：' + e.message + '（不影响上课页，本页会自动重试）';
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopPolling();
      $('pollinfo').textContent = '页面不可见，轮询已暂停';
    } else {
      startPolling();
    }
  });

  // ---------------------------------------------------------------- 工具栏
  function applyFilter() {
    const only = $('onlyBranch').checked;
    S.pageEls.forEach(function (sec) {
      const hide = only && !sec.dataset.hasBranch;
      sec.classList.toggle('filtered', !!hide);
    });
  }

  $('expandAll').addEventListener('click', function () {
    S.pageEls.forEach(function (sec) { sec.classList.remove('collapsed'); });
  });
  $('collapseAll').addEventListener('click', function () {
    S.pageEls.forEach(function (sec) { sec.classList.add('collapsed'); });
  });
  $('onlyBranch').addEventListener('change', applyFilter);
  $('follow').addEventListener('change', function () {
    // 关掉跟随：折叠状态一个字都不动，由用户自己点（这是关掉它的意思）。
    // 打开跟随：把"上一次展开过哪一页"清空，下一次轮询就会重新定位并展开当前页 ——
    // 否则会出现"刚打开跟随却没反应"（当前页恰好等于旧记录时不展开）。
    S.lastPage = -1;
    if ($('follow').checked) applyCurrent({ unit_id: '', slide_index: -1 });
  });

  (async function init() {
    try {
      const r = await fetch('/api/script/tree', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      renderTree(await r.json());
    } catch (e) {
      $('tree').textContent = '结构加载失败：' + e.message;
      return;
    }
    startPolling();
  })();
})();
</script>
</body>
</html>
